<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engenho Projetos | Administração</title><link rel="stylesheet" href="/style.css"></head><body><div id="nav"></div><main><p id="notice" class="notice">Carregando painel...</p><section><p class="eyebrow">CENTRAL OPERACIONAL</p><h2>Painel administrativo</h2><div class="columns"><div><h3>Gerenciamento de produtos</h3><form id="product-form" class="form" enctype="multipart/form-data"><input type="hidden" name="id"><input name="brand" placeholder="Marca" required><input name="model" placeholder="Modelo" required><input name="price" type="number" min="0" step="0.01" placeholder="Valor" required><input name="quantity" type="number" min="0" step="1" placeholder="Quantidade" required><input name="image" type="file" accept="image/*"><button>Salvar produto</button><button type="button" class="secondary" id="cancel-product">Cancelar edição</button></form><div id="products"></div></div><div><h3>Gerenciamento de clientes</h3><form id="client-form" class="form"><input type="hidden" name="id"><input name="name" placeholder="Nome" required><input name="email" type="email" placeholder="E-mail" required><input name="phone" placeholder="Telefone" required><input name="address" placeholder="Endereço"><button>Salvar cliente</button><button type="button" class="secondary" id="cancel-client">Cancelar edição</button></form><div id="clients"></div></div></div></section></main><script type="module" src="/administracao.js"></script></body></html>
